<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silencio Prototype</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #6b6b6b;
      color: #e5e5e5;
      font-family: "Courier New", monospace;
      overflow: hidden;
      user-select: none;
    }
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      background: #6b6b6b;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 10px;
      background: rgba(20, 20, 20, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
      max-width: 260px;
      pointer-events: none;
    }
    #overlay strong {
      color: #ffffff;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="overlay">
    <div><strong>Controls</strong></div>
    <div>W/S move, A/D rotate (tank)</div>
    <div>Shift to run</div>
    <div>Click to look &amp; start ambience</div>
  </div>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
